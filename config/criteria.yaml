# ---------------------------------------------------------------------------
# Criterios de búsqueda — Oficina / nave para CPD (Valencia)
# Editable sin tocar código. Todo el pipeline lee de aquí.
# ---------------------------------------------------------------------------

operacion: venta          # venta | alquiler | ambos

superficie:
  min_m2: 130
  max_m2: 300
  # Por encima de max_m2 sólo se acepta si el inmueble está muy bien:
  # hasta `max_m2_si_impecable` cuando no requiere apenas reforma.
  max_m2_si_impecable: 500
  # Tolerancia para no descartar anuncios con superficie mal declarada
  # (p.ej. 128 m2 "ampliables" o 310 m2 con planta divisible).
  tolerancia_pct: 10

tipologias:
  incluir:
    - nave                 # PREFERIDA: azotea propia y sin vecinos
    - oficina              # sólo en edificio de oficinas, mejor en plantas altas
  excluir:
    - vivienda
    - garaje
    - trastero
    - terreno
    - hotel
    - local_hosteleria
    - bajo_comercial       # descartado expresamente
    - local_calle          # local a pie de calle: descartado
    - entresuelo

# --- Requisitos duros: si fallan de forma demostrable, se descarta -----------
requisitos_duros:
  # Nada en edificio residencial: el CPD necesita acometida propia,
  # horario 24x7 y no depender de una comunidad de vecinos.
  no_edificio_viviendas: true
  # Nada a pie de calle: un bajo comercial o local de calle queda descartado
  # aunque los metros y la zona encajen (escaparate, ruido, y sobre todo
  # riesgo de agua a cota cero).
  no_bajo_comercial: true
  # Tope de precio: por encima, fuera.
  precio_max_eur: 400000
  # Debe poder ubicarse maquinaria de clima en cubierta/azotea o patio propio,
  # con espacio para ESCALAR el número de máquinas.
  cubierta_o_azotea_ampliable: true
  # Potencia eléctrica objetivo del CPD.
  potencia:
    objetivo_kw: 250          # el usuario habla de 200-300 kW (o más)
    minimo_aceptable_kw: 200
    deseable_kw: 400          # margen de crecimiento
  # Desplazamiento máximo en coche desde el centro de Valencia.
  max_minutos_coche: 20
  # Riesgo de inundación (DANA): se descartan municipios y zonas marcadas.
  excluir_zonas_inundables: true

# --- Preferencias: suman/restan puntos, no descartan -------------------------
preferencias:
  estado:
    preferido: [buen_estado, reformado, seminuevo, obra_nueva]
    penalizado: [a_reformar, ruina]           # "poca reforma" pide el usuario
  plantas:
    # En oficinas se prefieren las ÚLTIMAS plantas: menos metros de tubería
    # hasta las máquinas de la azotea y menos exposición al agua.
    bonus_ultima_planta: true
  extras_valorados:
    - montacargas
    - acceso_camion
    - muelle_carga
    - grupo_electrogeno
    - centro_transformacion
    - fibra_optica
    - altura_libre_alta          # >3,5 m: falso suelo + clima
    - aparcamiento
    - seguridad_24h
  precio:
    # El tope duro está en requisitos_duros.precio_max_eur (400.000 €).
    # Este es el precio por m² a partir del cual se penaliza.
    max_eur_m2: 2600
  # La nave pequeña con azotea propia y sin vecinos es el escenario ideal;
  # la oficina en altura es la alternativa por el miedo al agua.
  tipologia_preferida: nave
  bonus_nave: 8
  bonus_oficina_planta_alta: 8

# --- Umbrales de decisión ----------------------------------------------------
scoring:
  # Puntuación 0-100. Por debajo de `umbral_descartar` no se envía nunca.
  umbral_descartar: 38
  # A partir de aquí entra en el email diario.
  umbral_email: 55
  # A partir de aquí el agente propone contactar con la propiedad.
  umbral_contacto: 72

# --- Ámbito geográfico -------------------------------------------------------
geo:
  centro_referencia: [39.4699, -0.3763]   # Plaza del Ayuntamiento, València
  radio_max_km: 25                        # filtro barato previo al cálculo real
