# ---------------------------------------------------------------------------
# Criterios de búsqueda — Oficina / nave para CPD (Valencia)
# Editable sin tocar código. Todo el pipeline lee de aquí.
# ---------------------------------------------------------------------------

operacion: venta          # venta | alquiler | ambos

# ---------------------------------------------------------------------------
# CRIBADO EN DOS NIVELES
#
#   vetos    -> lo que no tiene arreglo posible. Descarta, sin matices.
#   bandas   -> todo lo demás. No hay muros: hay rampas. Pasarse un poco
#               resta unos puntos; pasarse mucho resta muchos; y lo que se
#               queda cerca aparece en el email como "casi", nunca se pierde.
#
# La lógica: un precio o unos metros son negociables y compensables; estar en
# zona inundable o debajo de unos vecinos, no.
# ---------------------------------------------------------------------------

superficie:
  # Banda plena: aquí no se resta nada.
  ideal_min_m2: 150
  ideal_max_m2: 300
  min_m2: 130            # por debajo empieza a restar
  max_m2: 320            # por encima empieza a restar
  # Zona gris: entra penalizado y marcado como "se pasa / se queda corto".
  gris_min_m2: 100
  gris_max_m2: 500
  # Fuera de esto no hay conversación posible: veto.
  veto_min_m2: 100
  veto_max_m2: 600        # el doble del máximo: más allá no hay conversación

tipologias:
  incluir:
    - nave                 # PREFERIDA: azotea propia y sin vecinos
    - oficina              # sólo en edificio de oficinas, mejor en plantas altas
  excluir:
    - vivienda
    - garaje
    - trastero
    - terreno
    - hotel
    - local_hosteleria
    - bajo_comercial       # descartado expresamente
    - local_calle          # local a pie de calle: descartado
    - entresuelo

# --- Requisitos duros: si fallan de forma demostrable, se descarta -----------
requisitos_duros:
  # Nada en edificio residencial: el CPD necesita acometida propia,
  # horario 24x7 y no depender de una comunidad de vecinos.
  no_edificio_viviendas: true
  # Nada a pie de calle: un bajo comercial o local de calle queda descartado
  # aunque los metros y la zona encajen (escaparate, ruido, y sobre todo
  # riesgo de agua a cota cero).
  no_bajo_comercial: true
  # Precio: 400.000 € es el objetivo declarado. Un anuncio a 430.000 no está
  # "fuera": está a un 7 % de negociación. El veto se pone donde ya no hay
  # negociación posible.
  precio_objetivo_eur: 400000
  precio_veto_eur: 550000
  # Debe poder ubicarse maquinaria de clima en cubierta/azotea o patio propio,
  # con espacio para ESCALAR el número de máquinas.
  cubierta_o_azotea_ampliable: true
  # Potencia eléctrica objetivo del CPD.
  potencia:
    objetivo_kw: 250          # el usuario habla de 200-300 kW (o más)
    minimo_aceptable_kw: 200
    deseable_kw: 400          # margen de crecimiento
  # Desplazamiento en coche desde el centro de Valencia. Hasta 15 minutos no
  # resta nada; de 15 a 22 resta cada vez más; por encima de 22, fuera.
  # Medido con OSRM, no estimado: el Camp de Túria interior (Llíria, Bétera,
  # La Pobla de Vallbona, Benaguasil) cae aquí, a 23-27 minutos.
  max_minutos_coche: 15        # hasta aquí no resta nada
  minutos_exceso: 20           # a partir de aquí cuenta como "se pasa"
  veto_minutos_coche: 22       # por encima, fuera
  # Riesgo de inundación (DANA): se descartan municipios y zonas marcadas.
  excluir_zonas_inundables: true

# --- Preferencias: suman/restan puntos, no descartan -------------------------
preferencias:
  estado:
    preferido: [buen_estado, reformado, seminuevo, obra_nueva]
    penalizado: [a_reformar, ruina]           # "poca reforma" pide el usuario
  plantas:
    # En oficinas se prefieren las ÚLTIMAS plantas: menos metros de tubería
    # hasta las máquinas de la azotea y menos exposición al agua.
    bonus_ultima_planta: true
  extras_valorados:
    - montacargas
    - acceso_camion
    - muelle_carga
    - grupo_electrogeno
    - centro_transformacion
    - fibra_optica
    - altura_libre_alta          # >3,5 m: falso suelo + clima
    - aparcamiento
    - seguridad_24h
  precio:
    # Por debajo de esto, el precio es un argumento a favor.
    bueno_eur: 350000
    # Precio por m² a partir del cual se penaliza, y por debajo del cual
    # se premia (una nave a 750 €/m² merece una visita aunque sobren metros).
    max_eur_m2: 2600
    chollo_eur_m2: 1200
  # La nave pequeña con azotea propia y sin vecinos es el escenario ideal;
  # la oficina en altura es la alternativa por el miedo al agua.
  tipologia_preferida: nave
  bonus_nave: 8
  bonus_oficina_planta_alta: 8

# --- Umbrales de decisión ----------------------------------------------------
scoring:
  # Puntuación 0-100. Por debajo de `umbral_descartar` no se envía nunca.
  umbral_descartar: 38
  # A partir de aquí entra en el email diario.
  umbral_email: 55
  # A partir de aquí el agente propone contactar con la propiedad.
  umbral_contacto: 72
  # Los que se quedan a menos de esto del umbral van al bloque "casi" del
  # email, con una línea explicando qué les falta.
  margen_casi: 15
  # Umbral adaptativo: si la semana viene floja, el listón baja para no
  # dejarte sin nada que mirar; si viene cargada, sube para no saturar.
  adaptativo:
    activo: true
    dias_ventana: 7
    pocos_si_menos_de: 3      # menos de 3 envíos en la ventana...
    baja_umbral: 10           # ...baja el listón 10 puntos
    muchos_si_mas_de: 12      # más de 12 envíos...
    sube_umbral: 8            # ...lo sube 8
  # Pasarse en un eje se perdona; pasarse en dos exige excelencia.
  max_excesos_sin_excelencia: 1
  puntuacion_excelencia: 85

# --- Ámbito geográfico -------------------------------------------------------
geo:
  centro_referencia: [39.4699, -0.3763]   # Plaza del Ayuntamiento, València
  radio_max_km: 25                        # filtro barato previo al cálculo real
