# === ALREDEDORES ADMITIDOS ==================================================
# Minutos MEDIDOS en coche (OSRM) desde Pl. del Ayuntamiento, no estimados.
# El criterio es "llegar rápido y fácil": entra la primera corona
# metropolitana y el corredor norte de la V-21, que es autovía directa.
# Queda fuera el Camp de Túria interior (Llíria, Bétera, La Pobla de
# Vallbona, Benaguasil, L'Eliana, Náquera): a 23-31 minutos, ya es otro viaje.
alrededores:
  - {nombre: "Alboraya", minutos_coche: 10, riesgo_inundacion: medio, bonus: 8}
