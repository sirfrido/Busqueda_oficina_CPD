# === VALÈNCIA CAPITAL: distritos y ejes de oficinas =========================
valencia_capital:
  nombre_municipio: "València"
  minutos_coche: 0
  riesgo_inundacion: bajo
  # Ejes con parque real de edificios de oficinas exclusivos.
  zonas_prime:
