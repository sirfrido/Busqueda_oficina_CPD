# ---------------------------------------------------------------------------
# Mapa de zonas: qué entra, qué se descarta y a cuántos minutos en coche.
#
# `minutos_coche` = tiempo orientativo desde Pl. del Ayuntamiento (València)
# en hora valle. Se usa como fallback cuando no hay routing online disponible
# (OSRM). Si hay coordenadas y routing, manda el cálculo real.
#
# `riesgo_inundacion`: alto | medio | bajo  — basado en la comarca, el sistema
# de barrancos (Poyo, Saleta, Torrent, Magro) y el alcance de la DANA de
# octubre de 2024. Con `excluir_zonas_inundables: true` se descarta todo "alto".
# ---------------------------------------------------------------------------

