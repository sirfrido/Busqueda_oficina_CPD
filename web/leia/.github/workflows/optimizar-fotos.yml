# Optimiza las fotos que se suben desde el panel.
#
# Publicar la web lo hace Cloudflare Pages solo, con cada cambio. Lo único
# que hace falta por aquí es que una foto de 3 MB recién salida de la cámara
# no acabe tal cual en la web: este proceso la reduce y la vuelve a guardar
# en el repositorio, y Cloudflare publica ya la versión ligera.

name: Optimizar las fotos

on:
  push:
    branches: [main]
    paths: ['assets/img/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install --quiet Pillow

      - name: Reducir las que vengan grandes
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          import pathlib

          LADO_MAX = 2560          # más que esto no lo aprovecha ninguna pantalla
          PESO_MAX = 450 * 1024    # a partir de aquí, se vuelve a comprimir
          CALIDAD  = 82

          for f in sorted(pathlib.Path("assets/img").rglob("*")):
              if f.suffix.lower() not in (".jpg", ".jpeg", ".png", ".webp"):
                  continue
              peso = f.stat().st_size
              try:
                  original = Image.open(f)
                  formato = original.format          # se pierde al rotar: se lee antes
                  im = ImageOps.exif_transpose(original)
              except Exception as e:
                  print(f"  ! {f.name}: no se ha podido abrir ({e})")
                  continue

              grande = max(im.size) > LADO_MAX
              if not grande and peso <= PESO_MAX:
                  continue

              # Ojo: se conserva el nombre y el formato. Cambiar la extensión
              # dejaría a contenido.json apuntando a un archivo que ya no existe.
              if grande:
                  im.thumbnail((LADO_MAX, LADO_MAX), Image.LANCZOS)
              if formato == "JPEG":
                  im.convert("RGB").save(f, "JPEG", quality=CALIDAD, optimize=True, progressive=True)
              elif formato == "WEBP":
                  im.save(f, "WEBP", quality=CALIDAD, method=6)
              else:
                  im.save(f, formato, optimize=True)
              print(f"  · {f.name}: {peso//1024} KB → {f.stat().st_size//1024} KB  {im.size}")
          PY

      - name: Guardar los cambios
        run: |
          if git diff --quiet; then
            echo "Nada que optimizar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git commit -m "Optimiza las fotos subidas desde el panel"
          git push
