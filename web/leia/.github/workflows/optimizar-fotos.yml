# Lo que pasa cada vez que se guarda algo desde el panel.
#
# Publicar la web lo hace Cloudflare solo. Aquí se preparan las fotos:
#   1. Se encogen las que vengan pesadas de la cámara.
#   2. Se construye la portada apaisada a partir de la vertical, porque una
#      foto vertical a pantalla completa en un ordenador se queda en un primer
#      plano de la nariz. Así solo hay que subir una foto, no dos.

name: Preparar las fotos

on:
  push:
    branches: [main]
    paths:
      - 'assets/img/**'
      - 'contenido.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preparar-fotos          # si se guarda dos veces seguidas, que no se pisen
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install --quiet Pillow

      - name: Encoger las fotos pesadas
        run: python3 herramientas/optimizar.py

      - name: Construir la portada apaisada
        run: python3 herramientas/portada.py

      - name: Guardar los cambios
        run: |
          if git diff --quiet; then
            echo "Nada que preparar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git commit -m "Prepara las fotos subidas desde el panel"

          # Si mientras tanto se ha guardado otra cosa desde el panel, el push
          # se rechaza. Se reintenta reordenando encima de lo que haya llegado.
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Guardado en el intento $intento."
              exit 0
            fi
            echo "Rechazado (alguien guardó antes). Reintento $intento…"
            sleep $((intento * 5))
            git pull --rebase --autostash origin main || exit 1
          done
          echo "No se ha podido guardar después de 5 intentos."
          exit 1
