<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leia Cervantes — Actriz</title>
<meta name="description" content="Book de Leia Cervantes Hernández, actriz: foto book, video book y experiencia.">
<meta name="theme-color" content="#ffffff">

<!-- Al compartir por WhatsApp: pon aquí la URL definitiva cuando la publiques -->
<meta property="og:type" content="website">
<meta property="og:title" content="Leia Cervantes — Actriz">
<meta property="og:description" content="Foto book, video book y experiencia.">
<meta property="og:image" content="assets/img/portada-ancha.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23fff'/><text x='50' y='72' font-size='64' font-family='Helvetica,Arial,sans-serif' font-weight='700' text-anchor='middle'>L</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body>
<a class="salto" href="#fotos">Saltar a las fotos</a>

<!-- ══ PORTADA ══ -->
<section class="hero" id="inicio">
  <picture class="hero__imagen">
    <source id="portada-ancha" media="(min-aspect-ratio: 4/5)" srcset="assets/img/portada-ancha.jpg">
    <img class="hero__fondo" id="foto-principal" src="assets/img/portada.jpg" alt="" fetchpriority="high">
  </picture>
  <div class="hero__centro">
    <h1 class="hero__nombre" data-campo="nombre">Leia</h1>
    <p class="hero__apellidos" data-campo="apellidos"></p>
    <a class="boton boton--claro" href="#fotos">Ver foto book</a>
  </div>
</section>

<header class="barra" id="barra">
  <div class="barra__marca">
    <a href="#inicio" data-campo="marca">Leia Cervantes</a>
    <span data-campo="titular">Actriz</span>
  </div>
  <nav class="barra__menu" aria-label="Navegación principal">
    <a href="#fotos">Foto book</a>
    <a href="#videos">Video book</a>
    <a href="#experiencia">Experiencia</a>
    <a href="#contacto">Contacto</a>
  </nav>
</header>

<main>

  <!-- ══ FOTO BOOK ══ -->
  <section id="fotos" aria-label="Foto book">
    <div class="galeria" id="galeria"></div>
  </section>

  <!-- ══ VIDEO BOOK ══ -->
  <section class="seccion" id="videos">
    <h2 class="seccion__titulo">Video book</h2>
    <div id="video-destacado"></div>
    <div class="videos" id="videos-lista"></div>
  </section>

  <!-- ══ EXPERIENCIA ══ -->
  <section class="seccion" id="experiencia">
    <h2 class="seccion__titulo">Experiencia</h2>
    <p class="seccion__lead" data-campo="presentacion"></p>

    <div class="experiencia">
      <aside class="ficha" aria-label="Ficha de la actriz">
        <h3 class="etiqueta">Ficha</h3>
        <dl id="ficha-datos"></dl>

        <div id="bloque-idiomas" hidden>
          <h3 class="etiqueta">Idiomas</h3>
          <dl id="ficha-idiomas"></dl>
        </div>

        <div id="bloque-habilidades" hidden>
          <h3 class="etiqueta">Habilidades</h3>
          <ul class="habilidades" id="ficha-habilidades"></ul>
        </div>
      </aside>

      <div class="creditos" id="creditos"></div>
    </div>
  </section>

  <!-- ══ CONTACTO ══ -->
  <section class="seccion" id="contacto">
    <h2 class="seccion__titulo">Contacto</h2>
    <div class="contacto" id="contacto-datos"></div>
  </section>

</main>

<footer class="pie">
  <p><span data-campo="marca">Leia Cervantes</span> · © <span id="anio"></span></p>
  <p>Las imágenes y los vídeos de esta web no pueden reproducirse sin autorización.</p>
</footer>

<!-- Visor de fotos -->
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
  <button class="visor__volver" id="visor-cerrar" aria-label="Cerrar">&#8592;</button>
  <button class="visor__nav visor__nav--prev" id="visor-prev" aria-label="Foto anterior">&#8249;</button>
  <figure class="visor__figura">
    <img id="visor-img" alt="">
    <figcaption id="visor-pie"></figcaption>
  </figure>
  <button class="visor__nav visor__nav--next" id="visor-next" aria-label="Foto siguiente">&#8250;</button>
</div>

<noscript><p class="aviso-js">Esta web necesita JavaScript para mostrar el book.</p></noscript>

<script src="assets/js/datos.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
